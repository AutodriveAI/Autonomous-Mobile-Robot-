amr_driver_node:
  ros__parameters:
    # NUCLEO ST-LINK virtual COM port detected on this computer.
    serial_port: "/dev/stm32"
    baud_rate: 115200

    cmd_vel_topic: "cmd_vel"
    odom_topic: "odom"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    publish_tf: true

    publish_rate_hz: 20.0
    # Zero disables the ROS-side stale-command stop while tuning Nav2. Nav2
    # remains responsible for publishing cmd_vel=0; the STM32 firmware timeout
    # is still the final fallback if communication stops completely.
    cmd_vel_timeout_s: 0.0

    # TODO: measure these on your actual robot -- everything else in this
    # node (cmd_vel scaling, odometry) is wrong until these are correct.
    wheel_radius_m: 0.0325      # e.g. 65 mm diameter wheel -> 0.0325 m radius
    wheel_separation_m: 0.175   # measured center-to-center distance between both wheels

    # HC-020K single-channel encoder with a 20-slit disk on the wheel axle:
    # one debounced rising edge per slit gives about 20 ticks/wheel revolution.
    ticks_per_revolution: 20
    # Absolute ROS-side target limit. With the current 20-tick wheel encoder,
    # 200 ticks/s is about 10 wheel revolutions/s.
    max_ticks_per_second: 200.0

    # Keep disabled during Nav2 debugging. We want to see the command produced
    # by controller_server / velocity_smoother / twist_mux, not a compensated
    # command invented by amr_driver.
    min_nonzero_ticks_per_second: 0.0
    refresh_nonzero_commands: false
    refresh_log_interval_s: 1.0
