amcl:
  ros__parameters:
    # Real robot uses wall time. Use true only for Gazebo or rosbag playback.
    use_sim_time: false

    # TF contract:
    #   AMCL publishes map -> odom
    #   amr_driver publishes odom -> base_link
    #   robot_state_publisher publishes base_link -> lidar_link -> lidar_scan_link
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    tf_broadcast: true
    transform_tolerance: 0.5

    # Physical RPLIDAR scan topic.
    scan_topic: /scan

    # Particle filter size. More particles are more robust, but cost more CPU.
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # Odometry noise model.
    # Larger values mean AMCL trusts wheel odometry less and scan matching more.
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.20

    # Laser likelihood-field model compares scan endpoints against the saved
    # occupancy-grid distance field. This is the common stable AMCL setup.
    laser_model_type: likelihood_field
    max_beams: 80
    laser_min_range: -1.0
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.20
    z_hit: 0.80
    z_rand: 0.20
    z_short: 0.05
    z_max: 0.05
    lambda_short: 0.10

    # Only update after meaningful motion. This keeps CPU use reasonable while
    # still localizing quickly on a slow indoor AMR.
    update_min_d: 0.05
    update_min_a: 0.05

    # Recovery behavior if the particle cloud becomes weak.
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.10

    # Keep beam skipping off first for easier debugging.
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # Initial pose is supplied from RViz using the 2D Pose Estimate tool.
    set_initial_pose: false
    always_reset_initial_pose: false
    save_pose_rate: 0.5

map_server:
  ros__parameters:
    use_sim_time: false

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - amcl
