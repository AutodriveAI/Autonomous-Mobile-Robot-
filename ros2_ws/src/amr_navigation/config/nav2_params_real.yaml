bt_navigator:
  ros__parameters:
    use_sim_time: true

    # Nav2 uses the normal mobile-robot TF chain:
    #
    #   map -> odom -> base_link
    #
    # map -> odom is published by localization, currently AMCL.
    # odom -> base_link is published by Gazebo in simulation, and by
    # amr_driver on the real robot.
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    # Behavior Tree timing. 10 ms is the normal Nav2 default.
    bt_loop_duration: 10
    # Foxy's default 20 ms action response timeout is too tight on the Jetson
    # when costmaps, AMCL, and DWB are active. Allow recovery goals enough time
    # to be acknowledged without aborting the behavior tree with send_goal failed.
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    enable_groot_monitoring: false
    default_bt_xml_filename: "/opt/ros/foxy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml"

    # Foxy-compatible behavior-tree plugin libraries.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_to_pose_action_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true

    # How often Nav2's local controller computes a new velocity command.
    # The Jetson Nano can miss 20 Hz cycles with AMCL, costmaps, lidar, and
    # DWB running together, so use 10 Hz for the physical robot bringup.
    controller_frequency: 10.0

    # Small values below these thresholds are treated as zero.
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001

    # If the controller briefly cannot find a valid command, allow a small
    # grace window before declaring failure.
    failure_tolerance: 0.3

    progress_checker_plugin: progress_checker
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      # Final in-place heading correction does not count as translational
      # progress, so allow enough time for it before declaring the robot stuck.
      movement_time_allowance: 30.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false

      # Differential-drive robot: x and theta motion only; y velocity is zero.
      #
      # Real robot note:
      # The physical drivetrain currently has a large low-command deadband.
      # With wheel_radius_m=0.0325 and ticks_per_revolution=20:
      #
      #   0.25 m/s  -> about V,24,24
      #   0.60 m/s  -> about V,59,59
      #   1.00 m/s  -> about V,98,98
      #   1.2252 m/s -> V,120,120 (maximum translation)
      #   1.00 rad/s turn -> about V,-9,9
      #   4.00 rad/s turn -> about V,-34,34 (minimum rotation)
      #   6.00 rad/s turn -> about V,-51,51 (maximum rotation)
      #
      # Keep a useful physical command range instead of forcing every nonzero
      # correction to the maximum. The former near-identical minimum/maximum
      # values made DWB alternate between full-speed left and right turns.
      min_vel_x: 0.0
      max_vel_x: 1.2252211349
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 6.0

      # Physical robot minimum useful command.
      #
      # DWB is allowed to sample/choose velocities above this translational
      # speed whenever it chooses a nonzero forward/backward command. Without
      # this, Nav2 can repeatedly publish tiny velocities that are valid in
      # math but too weak to move the real drivetrain.
      min_speed_xy: 0.60
      max_speed_xy: 1.2252211349

      # About V,-34,34: just above the previously ineffective V,-30,30 command,
      # with a narrower range for smoother final corrections up to V,-51,51.
      min_speed_theta: 4.0

      # Softer acceleration prevents a correction from immediately becoming
      # a maximum command and reduces overshoot when its sign changes.
      acc_lim_x: 1.5
      acc_lim_y: 0.0
      acc_lim_theta: 8.0
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -8.0

      # DWB samples many candidate velocities and scores them.
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 10
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2

      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      # Critics are the scoring terms DWB uses to choose a velocity.
      # - BaseObstacle avoids obstacles in the local costmap.
      # - PathAlign / PathDist keep the robot near the global path.
      # - GoalAlign / GoalDist pull it toward the final goal.
      # - RotateToGoal helps final heading alignment.
      # - Oscillation discourages back-and-forth indecision.
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      BaseObstacle.scale: 0.02
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 2.0

      # Local costmap moves with the robot. It only needs nearby obstacle data.
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05

      # Robot physical diameter is roughly 20 cm, but a slightly larger radius
      # gives Nav2 a safety buffer around the circular body.
      robot_radius: 0.14

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.05
          obstacle_max_range: 2.5
          raytrace_min_range: 0.05
          raytrace_max_range: 3.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.16
        cost_scaling_factor: 5.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link

      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.14

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.05
          obstacle_max_range: 2.5
          raytrace_min_range: 0.05
          raytrace_max_range: 3.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.20
        cost_scaling_factor: 5.0

      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

recoveries_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1

    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0

    recovery_plugins: ["spin", "back_up", "wait"]
    spin:
      plugin: nav2_recoveries/Spin
    back_up:
      plugin: nav2_recoveries/BackUp
    wait:
      plugin: nav2_recoveries/Wait

    simulate_ahead_time: 2.0
    # Match the angular range tuned for DWB path following.
    max_rotational_vel: 6.0
    min_rotational_vel: 4.0
    rotational_acc_lim: 8.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false

    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true

    # Nav2 controller output is smoothed before entering twist_mux.
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP

    max_velocity: [1.2252211349, 0.0, 11.6687727133]
    min_velocity: [-1.2252211349, 0.0, -11.6687727133]
    max_accel: [1.5, 0.0, 8.0]
    max_decel: [-1.5, 0.0, -8.0]

    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]

    # If Nav2 stops publishing commands, the smoother publishes zero.
    # twist_mux also has its own timeout, so this is an extra safety layer.
    velocity_timeout: 0.5
